{% extends "base.html" %}
{% block title %}

{% endblock %}

{% block css %}
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <meta name="referrer" content="no-referrer" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="/static/layui/css/layui.css" rel="stylesheet"/>
    <link href="/static/step-lay/step.css" rel="stylesheet">
    <style>
    </style>
{% endblock %}

{% block content %}
    <div class="layui-fluid">
        <div class="layui-card">
            <div class="layui-card-body" style="padding-top: 40px;">
                <div class="layui-carousel" id="stepForm" lay-filter="stepForm" style="margin: 0 auto;">
                    <div carousel-item>
                        <div>
                            <form class="layui-form" style="margin: 0 auto;max-width: 460px;padding-top: 40px;">

                                <div class="layui-form-item">
                                    <label class="layui-form-label">购买数量:</label>
                                    <div class="layui-input-block">
                                        <input name="num" type="number" placeholder="请填写数量" value="1" class="layui-input"
                                               lay-verify="number" required >
                                    </div>
                                </div>



                                <div class="layui-form-item">
                                    <div class="layui-input-block">
                                        <button class="layui-btn" lay-submit lay-filter="formStep">
                                            &emsp;下一步&emsp;
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                        <div>
                            <form class="layui-form" style="margin: 0 auto;max-width: 460px;padding-top: 40px;">


                                <div class="layui-form-item">
                                    <label class="layui-form-label">入款金额:</label>
                                    <div class="layui-input-block">
                                        <div class="layui-form-mid layui-word-aux">
                                            <span id="total" style="font-size: 18px;color: #333;">1800 元</span>
                                        </div>
                                    </div>
                                </div>

                                <div class="layui-form-item">
                                    <label class="layui-form-label">入款方式:</label>
                                    <div class="layui-input-block">
                                        <div class="layui-form-mid layui-word-aux">支付宝</div>
                                    </div>
                                </div>

                                <div class="layui-form-item">
                                    <div class="layui-input-block">
                                        <button type="button" class="layui-btn layui-btn-primary pre">上一步</button>
                                        <button class="layui-btn" lay-submit lay-filter="formStep2">
                                            &emsp;确认入款&emsp;
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                        <div>
                            <div style="text-align: center;margin-top: 90px;">
                                <i class="layui-icon layui-circle"
                                   style="color: white;font-size:30px;font-weight:bold;background: #52C41A;padding: 20px;line-height: 80px;">&#xe605;</i>
                                <div style="font-size: 24px;color: #333;font-weight: 500;margin-top: 30px;">
                                    入款成功
                                </div>
                                <div style="font-size: 14px;color: #666;margin-top: 20px;">预计两小时到账</div>
                            </div>
                            <div style="text-align: center;margin-top: 50px;">
                                <button class="layui-btn next">再入一笔</button>
{#                                <button class="layui-btn layui-btn-primary">查看账单</button>#}
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
{% endblock %}

{% block js %}
    <script src="/static/layui/layui.js"></script>
    <script src="/static/step-lay/step.js"></script>
    <script>

        layui.config({
            base: '/static/step-lay/'
        }).use(['form', 'step', 'laydate'], function () {
            var $ = layui.$
                , form = layui.form
                , laydate = layui.laydate
                , step = layui.step;
            //常规用法


            step.render({
                elem: '#stepForm',
                filter: 'stepForm',
                width: '100%', //设置容器宽度
                stepWidth: '750px',
                height: '500px',
                stepItems: [{
                    title: '填写入款信息'
                }, {
                    title: '确认入款信息'
                }, {
                    title: '完成'
                }]
            });


            form.on('submit(formStep)', function (data) {
                step.next('#stepForm');
                var total = parseInt($('input[name="num"]').val()) * {{ info.price |safe }};
                $('#total').text(total)
                $('#date').text($('input[name="date"]').val())
                return false;
            });

            form.on('submit(formStep2)', function (data) {
                layer.open({
                    type: 2,
                    title: '很多时候，我们想最大化看，比如像这个页面。',
                    shadeClose: true,
                    shade: false,
                    maxmin: true, //开启最大化最小化按钮
                    area: ['893px', '600px'],
                    content: '{% url "pay" %}' + "?jid=" + "{{ info.id }}" +'&num='+$('input[name="num"]').val() + '&date='+$('input[name="date"]').val()
                });
                step.next('#stepForm');
                return false;
            });

            $('.pre').click(function () {
                step.pre('#stepForm');
            });

            $('.next').click(function () {
                step.next('#stepForm');
            });
        })
    </script>
{% endblock %}
