{% extends "base.html" %}
{% block title %}修改资料{% endblock %}
{% block css %}
    <style>
        .profile-table { max-width: 480px; margin: 0 auto; }
        .profile-form { max-width: 480px; margin: 20px auto 0; }
    </style>
{% endblock %}
{% block content %}
    <div class="layui-tab layui-tab-brief" lay-filter="docDemoTabBrief">
        <ul class="layui-tab-title" style="width: 200px; margin: 10px auto">
            <li class="layui-this">我的信息</li>
            <li>修改信息</li>
        </ul>
        <div class="layui-tab-content">
            <div class="layui-tab-item layui-show">
                <table class="layui-table profile-table">
                    <colgroup>
                        <col width="120">
                        <col width="200">
                    </colgroup>
                    <tbody>
                        <tr><td>ID</td><td>{{ my_info.id }}</td></tr>
                        <tr><td>姓名</td><td>{{ my_info.name }}</td></tr>
                        <tr><td>手机号</td><td>{{ my_info.tel }}</td></tr>
                        <tr><td>密码</td><td>******</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="layui-tab-item">
                <form class="layui-form profile-form" action="{% url 'profile' %}" method="post">
                    <div class="layui-form-item">
                        <label class="layui-form-label">姓名</label>
                        <div class="layui-input-block">
                            <input type="text" name="name" required lay-verify="required" placeholder="请输入姓名"
                                   autocomplete="off" class="layui-input" value="{{ my_info.name }}">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">手机号</label>
                        <div class="layui-input-block">
                            <input type="text" name="tel" required lay-verify="required" placeholder="请输入手机号"
                                   autocomplete="off" class="layui-input" value="{{ my_info.tel }}">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">新密码</label>
                        <div class="layui-input-block">
                            <input type="password" name="password1" placeholder="不修改请留空"
                                   autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">确认密码</label>
                        <div class="layui-input-block">
                            <input type="password" name="password2" placeholder="不修改请留空"
                                   autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-input-block">
                            <button class="layui-btn" lay-submit lay-filter="formDemo">保存</button>
                            <button type="reset" class="layui-btn layui-btn-primary">重置</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
{% block js %}
    <script>
        layui.use('element', function () {
            var element = layui.element;
        });
    </script>
    <script>
        layui.use('form', function () {
            var form = layui.form;
            form.on('submit(formDemo)', function () {
                var p1 = $('input[name="password1"]').val();
                var p2 = $('input[name="password2"]').val();
                if (p1 !== p2) {
                    alert('两次密码不一致');
                    return false;
                }
            });
        });
    </script>
{% endblock %}
